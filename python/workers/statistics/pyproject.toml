[project]
name = "starter-worker-statistics"
version = "0.5.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "starter-worker-common",
]

[tool.uv.sources]
starter-worker-common = { workspace = true }

[tool.starter.worker]
name = "statistics"
module = "starter_worker_statistics.handler"
sample-request = '{"values":[1,2,3,4,5]}'

[build-system]
requires = ["uv_build==0.11.31"]
build-backend = "uv_build"
