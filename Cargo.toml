[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/app-contracts",
    "crates/app-core",
    "crates/python-host",
]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
tauri = "=2.11.5"
tauri-plugin-shell = "=2.3.5"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
