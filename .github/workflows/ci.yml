name: CI

on:
  push:
  pull_request:

jobs:
  native-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.5.0

      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.31"
          python-version: "3.13.11"
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - run: npm install
      - run: uv sync --directory python --all-packages --all-groups
      - run: npm run doctor
      - run: npm run validate:structure
      - run: npm run frontend:typecheck
      - run: npm run python:test
      - run: npm run python:smoke
      - run: npm run python:lint
      - run: npm run rust:fmt
      - run: npm run rust:clippy
      - run: npm run rust:test
      - run: npm run python:build
      - run: npm run desktop:compile
